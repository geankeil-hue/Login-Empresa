<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Empresa</title>
</head>
<body>
<div class="login-container">
        <h2>Login Empresa</h2>
        <form action="LoginEmpresa.php" method="POST">
            <label for="Usuário">Usuário:</label>
            <input type="text" id="Usuário" name="Usuário" required>
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" name="cargo" required>
            <label for="CPF">CPF:</label>
            <input type="text" id="CPF" name="CPF" required>
            <label for="nome da empresa">Nome da Empresa:</label>
            <input type="text" id="nome da empresa" name="nome da empresa" required>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" required>
            <label for="cnpj">CNPJ:</label>
            <input type="text" id="cnpj" name="cnpj" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Login</button>
            <label for="esqueceu a senha ?">Esqueceu a senha ?</label>
            <button type="button" onclick="window.location.href='esqueceu_senha.php'">Recuperar Senha</button>
        </form>
     </div>
</body>
</html>
